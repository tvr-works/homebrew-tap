name: Homebrew checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Audit changed packages
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Set up Homebrew and check out the tap
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          core: false
          cask: false
          stable: true

      - name: Install Homebrew style dependencies
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: brew install-bundler-gems --groups=style

      - name: Check tap syntax
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          set -euo pipefail
          brew test-bot --only-tap-syntax

      - name: Audit tap packages
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          brew audit --cask --strict --online --tap=tvr-works/tap --except=github_prerelease_version
          brew audit --strict --online tvr-works/tap/xkcdpass

      - name: Verify the published Frame archive and publisher identity
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(brew info --json=v2 --cask tvr-works/tap/frame | jq -r '.casks[0].version')"
          .github/scripts/prepare-package-update.sh frame "$version" "$RUNNER_TEMP/frame-verified-outputs"

      - name: Qualify Frame installation and legacy receipt migration
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ''
          HOMEBREW_GITHUB_API_TOKEN: ''
        run: .github/scripts/test-frame-migration.sh

      - name: Retain Frame migration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frame-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frame-migration-report.txt
            ${{ runner.temp }}/frame-interrupted-*.log
            ${{ runner.temp }}/frame-legacy-resolution.json
          if-no-files-found: ignore
          retention-days: 7

  xkcdpass:
    name: Install xkcdpass (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Prepare Homebrew ownership on the ephemeral Linux runner
        if: runner.os == 'Linux'
        run: |
          # Blacksmith's image includes Homebrew owned by a different image user.
          # Repair only this job VM's fixed prefix before setup-homebrew updates it.
          if [[ -d /home/linuxbrew/.linuxbrew ]]; then
            sudo chown -R "$(id -u):$(id -g)" /home/linuxbrew/.linuxbrew
          fi
      - id: homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          core: false
          cask: false
          stable: true
      - name: Install published archive and test runtime
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          # Keep the core API available; disabling it forces a full core Git clone.
          # The fully qualified name must still select this tap's local formula.
          brew info --json=v2 tvr-works/tap/xkcdpass | jq -e '.formulae | length == 1 and .[0].tap == "tvr-works/tap"' >/dev/null
          brew install --build-from-source tvr-works/tap/xkcdpass 2>&1 | tee "${RUNNER_TEMP}/xkcdpass-install.log"
          brew test tvr-works/tap/xkcdpass 2>&1 | tee "${RUNNER_TEMP}/xkcdpass-test.log"
          brew uninstall tvr-works/tap/xkcdpass
      - name: Verify canonical release metadata and both archives
        if: runner.os == 'macOS'
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(brew info --json=v2 tvr-works/tap/xkcdpass | jq -r '.formulae[0].versions.stable')"
          .github/scripts/prepare-package-update.sh xkcdpass "${version}" "${RUNNER_TEMP}/verified-package-outputs"
      - name: Save Homebrew failure evidence
        if: failure() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-failure-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xkcdpass-*.log
          if-no-files-found: ignore
          retention-days: 7

  publication:
    name: Test release verification
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
